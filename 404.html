  <meta name="theme-color" content="#6183FC" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body>
  <div class="not-found">
    <div class="not-found-card">
      <span class="script-accent" aria-hidden="true">page not found</span>
      <p class="eyebrow">WoowTech · EMQX 5.8.9</p>
      <div class="not-found-code">404</div>
      <h1 style="font-family:var(--font-display);font-size:clamp(28px,5vw,40px);margin:0 0 20px;line-height:1.15;color:var(--ink-900);">找不到這一頁</h1>
      <p>網址可能打錯了，或這一章已經改名。回資源總覽挑一本手冊，或從第 1 章開始看。</p>
      <div class="not-found-actions">
        <a class="button button-primary" href="index.html"><i class="mdi mdi-home-outline" aria-hidden="true"></i>回資源總覽</a>
        <a class="button button-secondary" href="tutorial.html"><i class="mdi mdi-view-list-outline" aria-hidden="true"></i>教學目錄</a>
        <a class="button button-secondary" href="ch1_overview.html"><i class="mdi mdi-arrow-right" aria-hidden="true"></i>從第 1 章開始</a>
      </div>
    </div>
  </div>
  <script>
    /* GitHub Pages 404：自訂網域基準根目錄，project subpath 則以 repository 名稱為第一段。
       不發額外請求（避免 404 console noise），直接依 first segment 判定 site root，
       再將站內樣式與導覽按鈕改寫為 root-relative，讓 404 在深層路徑下也能正確連結。 */
    (function () {
      var ROOT_DIR = 'Woow_emqx_tutorial_site';
      var parts = (location.pathname || '/').split('/').filter(function (s) { return s !== ''; });
      var base = parts[0] === ROOT_DIR ? '/' + ROOT_DIR + '/' : '/';
      var root = base.replace(/\/$/, '');
      Array.prototype.forEach.call(document.querySelectorAll('a[href]'), function (el) {
        var val = el.getAttribute('href');
        if (val && !/^(https?:)?\/\//.test(val) && val.charAt(0) !== '#') {
          el.setAttribute('href', root + '/' + val.replace(/^\/+/, ''));
        }
      });
      Array.prototype.forEach.call(document.querySelectorAll('link[rel="stylesheet"]'), function (el) {
        var val = el.getAttribute('href') || '';
        if (val && !/^(https?:)?\/\//.test(val)) {
          el.setAttribute('href', root + '/' + val.replace(/^\/+/, ''));
        }
      });
    })();
  </script>
</body>
</html>
